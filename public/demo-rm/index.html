<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--bg:#F6F4EF;--surf:#FFFFFF;--surf2:#FBFAF7;--ink:#0E1424;--ink2:#2A3247;--mut:#596172;--line:#E3DED3;--acc:#2347F5;--acc-h:#1736D6;--acc-ink:#FFFFFF;--acc-soft:#E8ECFF;--sand:#E9E3D7;--terra:#B4442A;--ok:#11734F;--ok-soft:#DFF2E8;--warn:#9A4A06;--warn-soft:#FBEFD8;--bad:#B4232A;--bad-soft:#FBE4E4;--info:#1F45C9;--info-soft:#E6ECFF;
--r:16px;--r2:26px;--sh:0 24px 60px -28px rgba(14,20,36,.45);--fd:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--fb:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0F1A;--surf:#131A29;--surf2:#0F1522;--ink:#EEF1F7;--ink2:#C9D0DD;--mut:#9AA4B8;--line:#252E42;--acc:#8095FF;--acc-h:#9AACFF;--acc-ink:#0B0F1A;--acc-soft:#1B2547;--sand:#1D2333;--terra:#F29072;--ok:#55D3A4;--ok-soft:#10291F;--warn:#F2B25E;--warn-soft:#2E2210;--bad:#FF8E8E;--bad-soft:#341616;--info:#9AACFF;--info-soft:#1B2547;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B0F1A;--surf:#131A29;--surf2:#0F1522;--ink:#EEF1F7;--ink2:#C9D0DD;--mut:#9AA4B8;--line:#252E42;--acc:#8095FF;--acc-h:#9AACFF;--acc-ink:#0B0F1A;--acc-soft:#1B2547;--sand:#1D2333;--terra:#F29072;--ok:#55D3A4;--ok-soft:#10291F;--warn:#F2B25E;--warn-soft:#2E2210;--bad:#FF8E8E;--bad-soft:#341616;--info:#9AACFF;--info-soft:#1B2547;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--fd);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.025em}
p{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.sp{flex:1}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{display:block;height:100%;width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{box-shadow:0 8px 22px -10px rgba(14,20,36,.6)}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.acc:hover{background:var(--acc-h)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.btn.white{background:#fff;color:#0E1424}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.lg{padding:15px 26px;font-size:17px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--ink);text-decoration:none}
.iconbtn:hover{background:var(--sand)}
.cnt{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:600 11px/19px var(--fb);text-align:center}
.kick{font:600 13px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:14px}.center{text-align:center}
.media{position:relative;overflow:hidden;background:var(--mbg,var(--sand));isolation:isolate}
.media .fb{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);color:#0E1424;opacity:.9;z-index:0;filter:drop-shadow(0 18px 14px rgba(0,0,0,.18))}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
/* tienda */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;border:0}
.skip:focus{top:12px}
.promo{background:#0E1424;color:#fff;text-align:center;font-size:14px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:6px;height:72px}
.brand{display:block;height:28px;color:var(--ink);margin-right:22px}
.mainnav{display:flex;gap:2px}
.mainnav a{text-decoration:none;font-weight:500;color:var(--ink2);padding:8px 12px;border-radius:99px}
.mainnav a:hover,.mainnav a[aria-current=page]{background:var(--sand);color:var(--ink)}
.only-m{display:none}
.mnav{position:fixed;inset:0 auto 0 0;z-index:45;width:min(340px,86vw);background:var(--surf);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 24px;transform:translateX(-105%);transition:transform .3s;display:flex!important;flex-direction:column;gap:4px;overflow:auto;box-shadow:var(--sh);visibility:hidden}
.mnav.open{transform:none;visibility:visible}
.mnav a{text-decoration:none;font:700 24px var(--fd);padding:10px 4px;border-bottom:1px solid var(--line)}
.mnav .sm{font:500 16px var(--fb);border:0;padding:8px 4px;color:var(--mut)}
.hero{position:relative;min-height:min(86vh,780px);display:grid;align-items:end;color:#fff;overflow:hidden}
.hero .media{position:absolute;inset:0;--mbg:linear-gradient(135deg,#2347F5,#0E1424)}
.hero .media .fb{color:#E9E3D7;width:34%;height:60%;left:72%}
.hero .media img{object-position:50% 30%}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,20,36,0) 35%,rgba(14,20,36,.78)),linear-gradient(90deg,rgba(14,20,36,.45),transparent 60%)}
.hero-in{position:relative;z-index:2;padding-bottom:clamp(36px,7vw,80px);padding-top:120px;width:100%}
.hero h1{font-size:clamp(52px,10vw,136px);line-height:.9;letter-spacing:-.045em;max-width:11ch;margin:14px 0 18px;text-wrap:balance}
.hero .kick{color:#fff;opacity:.9}
.hero .lead{max-width:46ch;font-size:clamp(17px,1.6vw,20px);opacity:.92}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-1px;padding-top:26px;padding-bottom:6px}
.trust div{display:flex;gap:12px;align-items:center;padding:14px 4px}
.trust .ic{color:var(--acc)}
.trust b{display:block;font-weight:600}
.trust small{color:var(--mut);font-size:14px}
.sec{margin-top:clamp(56px,8vw,96px)}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sh h2,.h2{font-size:clamp(30px,4.4vw,52px)}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;color:var(--ink)}
.more:hover{color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{position:relative;text-decoration:none;color:#fff;border-radius:var(--r2);overflow:hidden;display:block}
.cat .media{aspect-ratio:3/4}
.cat:hover img{transform:scale(1.05)}
.cat span{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(14,20,36,.75));font:800 24px var(--fd);letter-spacing:-.02em}
.cat small{display:block;font:500 13px var(--fb);opacity:.85;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 18px}
.card{position:relative;display:flex;flex-direction:column}
.card .media{aspect-ratio:4/5;border-radius:var(--r)}
.card-a{display:block;border-radius:var(--r)}
.card:hover .media img{transform:scale(1.045)}
.badge{position:absolute;z-index:3;top:12px;left:12px;background:var(--surf);color:var(--ink);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;pointer-events:none}
.badge.terra{background:var(--terra);color:#fff}
.badge.dark{background:#0E1424;color:#fff}
.fav{position:absolute;z-index:3;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0E1424;display:grid;place-items:center}
.fav.on .ic{fill:var(--terra);stroke:var(--terra)}
.ci{padding:14px 2px 0;display:flex;flex-direction:column;gap:4px}
.ci h3{font:600 16px/1.3 var(--fb);letter-spacing:0}
.ci h3 a{text-decoration:none}
.ci h3 a:hover{text-decoration:underline}
.price{font:700 19px var(--fd);letter-spacing:-.01em}
.price s{font:400 14px var(--fb);color:var(--mut);margin-left:8px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qa button{min-width:42px;height:34px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);font-size:13px;font-weight:600}
.qa button:hover:not([disabled]){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.qa button[disabled]{color:var(--mut);opacity:.5;text-decoration:line-through;cursor:not-allowed}
.soldout{font-size:14px;color:var(--mut)}
.edit{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,4vw,56px);align-items:center}
.edit .media{border-radius:var(--r2);min-height:clamp(320px,42vw,560px);height:100%}
.edit h2{font-size:clamp(34px,4.6vw,60px);margin:14px 0 16px}
.edit p:not(.kick){color:var(--mut);font-size:18px;margin-bottom:26px;max-width:42ch}
.look{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.look figure{margin:0;position:relative;border-radius:var(--r2);overflow:hidden}
.look .media{aspect-ratio:3/4}
.look figcaption{position:absolute;z-index:2;left:14px;right:14px;bottom:14px;background:var(--surf);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.look figcaption b{font:700 17px var(--fd);display:block}
.look figcaption a{font-size:14px;font-weight:600;color:var(--acc);white-space:nowrap}
.news{background:var(--acc);color:#fff;margin-top:clamp(56px,8vw,96px)}
:root[data-theme=dark] .news{background:#1D33B8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .news{background:#1D33B8}}
.news-in{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(40px,6vw,72px)}
.news h2{font-size:clamp(34px,5vw,64px)}
.news p{opacity:.92;margin-top:12px;font-size:18px}
.news form{display:grid;gap:12px}
.news .row{display:flex;gap:10px;background:#fff;border-radius:99px;padding:6px}
.news input[type=email]{flex:1;min-width:0;border:0;background:transparent;padding:10px 16px;color:#0E1424;outline-offset:4px}
.news .chk{color:#fff;font-size:14px}
.news .done{background:rgba(255,255,255,.14);border-radius:18px;padding:18px 20px;font-size:17px}
.code{font:700 20px var(--fd);letter-spacing:.06em;background:#fff;color:#0E1424;border-radius:10px;padding:2px 10px}
footer.ft{background:#0E1424;color:#C9D0DD;margin-top:0;padding:56px 0 calc(32px + env(safe-area-inset-bottom,0px));font-size:15px}
.ft .brand{color:#fff;height:34px;margin-bottom:14px}
.ft .logo{--amp:#8EA2FF}
.ft-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
.ft h3{font:600 13px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:#fff;margin-bottom:12px}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ft a{color:#C9D0DD;text-decoration:none}
.ft a:hover{color:#fff;text-decoration:underline}
.ft .lr{display:inline-flex;align-items:center;gap:8px;border:1px solid #39425A;border-radius:12px;padding:8px 12px;margin-top:10px}
.ft-b{border-top:1px solid #252E42;margin-top:36px;padding-top:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:#9AA4B8}
.demo-sw{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;background:#0E1424;color:#fff;border-radius:99px;padding:10px 16px 10px 12px;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);border:1px solid #39425A}
.demo-sw i{width:8px;height:8px;border-radius:50%;background:#F2B25E;font-style:normal}
/* catálogo */
.pagehead{padding-top:clamp(28px,5vw,56px)}
.pagehead h1{font-size:clamp(40px,6vw,76px)}
.pagehead p{color:var(--mut);margin-top:10px;max-width:60ch}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 24px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 15px;font-weight:500;text-decoration:none;font-size:15px}
.chip[aria-pressed=true],.chip[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in{border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
.in:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.in[aria-invalid=true]{border-color:var(--bad)}
select.in{padding-right:30px}
textarea.in{min-height:96px;resize:vertical}
.in.sm{min-height:36px;padding:6px 10px;border-radius:10px;font-size:14px}
.in.num{width:92px}
.empty{text-align:center;padding:56px 16px;color:var(--mut)}
.empty h2{color:var(--ink);font-size:28px;margin-bottom:8px}
.empty .btn{margin-top:18px}
/* ficha */
.crumbs{font-size:14px;color:var(--mut);padding:22px 0}
.crumbs a{color:var(--mut)}
.pdp{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,56px);align-items:start}
.gal{display:grid;gap:12px}
.gal .media{border-radius:var(--r2)}
.gal .g1{aspect-ratio:4/5}
.gal .g2{aspect-ratio:16/10}
.buybox{position:sticky;top:96px;display:grid;gap:14px}
.buybox h1{font-size:clamp(36px,4.4vw,56px)}
.price.lg{font-size:28px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 0}
.save{font:600 13px var(--fb);color:#fff;background:var(--terra);border-radius:99px;padding:3px 10px;margin-left:10px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:600;display:flex;justify-content:space-between;width:100%;margin-bottom:10px}
.sizes .opts{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:58px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);font-weight:600}
.sz:hover:not([disabled]){border-color:var(--ink)}
.sz[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sz[data-out]{color:var(--mut);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px),var(--surf)}
.stockmsg{min-height:22px;font-size:14px;font-weight:500}
.stockmsg.warn{color:var(--warn)}.stockmsg.bad{color:var(--bad)}.stockmsg.ok{color:var(--ok)}
.addrow{display:flex;gap:10px}
.grow{flex:1}
.qtyc{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;background:var(--surf)}
.qtyc button{width:40px;height:48px;border:0;background:none;font-size:18px;border-radius:99px}
.qtyc output{min-width:24px;text-align:center;font-weight:600}
.qtyc.sm button{width:32px;height:32px;font-size:16px}
.mini-perks{list-style:none;padding:16px 0;margin:4px 0 0;display:grid;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini-perks li{display:flex;gap:10px;align-items:center;font-size:15px}
.mini-perks .ic{color:var(--acc)}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:10px;color:var(--mut)}
.notify{background:var(--sand);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.notify .row{display:flex;gap:8px}
/* carrito */
.veil{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.veil.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surf);z-index:50;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:var(--sh);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:26px}
.db{flex:1;overflow:auto;padding:4px 20px}
.df{padding:18px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.df .row{display:flex;justify-content:space-between;font-weight:600;font-size:18px}
.shipbar{padding:14px 0 6px;font-size:14px}
.shipbar .bar{height:6px;background:var(--sand);border-radius:99px;margin-top:8px;overflow:hidden}
.shipbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.cl{list-style:none;padding:0;margin:0}
.cl li{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.cl .media{width:72px;aspect-ratio:4/5;border-radius:12px}
.cl a{font-weight:600;text-decoration:none}
.cl small{display:block;color:var(--mut);margin:2px 0 8px}
.cl .r{text-align:right;display:grid;gap:8px;justify-items:end}
.cl .link{font-size:13px;color:var(--mut);font-weight:500}
/* buscador */
.search{position:fixed;inset:0 0 auto;z-index:50;background:var(--surf);padding:calc(16px + env(safe-area-inset-top,0px)) 0 22px;box-shadow:var(--sh);transform:translateY(-105%);transition:transform .3s;visibility:hidden;max-height:90vh;overflow:auto}
.search.open{transform:none;visibility:visible}
.search .row{display:flex;gap:10px;align-items:center}
.search input{font-size:20px;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:12px 4px;background:transparent}
.search input:focus{box-shadow:none;border-color:var(--acc)}
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px}
.sres a{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-decoration:none;padding:8px;border-radius:14px}
.sres a:hover{background:var(--sand)}
.sres .media{width:56px;aspect-ratio:1;border-radius:10px}
/* checkout */
.co{padding-top:28px}
.co h1{font-size:clamp(34px,4.6vw,56px);margin-bottom:22px}
.co-g{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:start}
.box{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.4vw,26px);margin-bottom:16px}
.box h2{font-size:22px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.box h2 .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 15px var(--fb)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:6px;font-size:14px;font-weight:500;align-content:start}
.fld.full{grid-column:1/-1}
.fld > span{color:var(--ink2)}
.err{font-style:normal;color:var(--bad);font-size:13px;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-top:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--surf)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--acc);flex:none}
.opt b{display:block;font-weight:600}
.opt small{color:var(--mut);font-size:14px}
.opt .pr{margin-left:auto;font-weight:600;white-space:nowrap}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.opt:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.sum{position:sticky;top:96px}
.sum h2{font-size:22px}
.sum ul{list-style:none;padding:0;margin:0 0 12px}
.sum li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum .media{width:56px;aspect-ratio:4/5;border-radius:10px}
.sum small{display:block;color:var(--mut)}
.tl{display:grid;gap:8px;margin-top:12px}
.tl div{display:flex;justify-content:space-between;gap:10px}
.tl .tot{font:800 24px var(--fd);padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.cpn{display:flex;gap:8px;margin-top:6px}
.cpn input{text-transform:uppercase}
.note{font-size:14px;color:var(--mut);margin-top:10px}
.alert{border-radius:14px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.thanks{max-width:760px;margin:0 auto;padding-top:48px;text-align:center}
.thanks .tick{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 18px}
.thanks h1{font-size:clamp(34px,5vw,58px)}
.thanks .box{text-align:left;margin-top:26px}
.track{max-width:880px;margin:0 auto}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;counter-reset:s}
.steps li{position:relative;padding-top:38px;font-size:14px;text-align:center;color:var(--mut)}
.steps li::before{content:"";position:absolute;top:10px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surf);border:2px solid var(--line);z-index:1}
.steps li::after{content:"";position:absolute;top:18px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.done{color:var(--ink);font-weight:600}
.steps li.done::before{background:var(--acc);border-color:var(--acc)}
.steps li.done::after{background:var(--acc)}
.prose{max-width:760px}
.prose h2{font-size:26px;margin:30px 0 10px}
.prose p,.prose li{color:var(--ink2);margin-bottom:10px}
.prose ul{padding-left:20px}
.helpnav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
/* modal y panel lateral */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .mbox{pointer-events:auto;background:var(--surf);border-radius:24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:var(--sh);position:relative}
.modal .mbox.wide{width:min(760px,100%)}
.modal h2{font-size:28px;margin:0 40px 10px 0}
.mx{position:absolute;top:12px;right:12px}
.mact{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:60;background:var(--bg);transform:translateX(105%);transition:transform .3s;overflow:auto;box-shadow:var(--sh);visibility:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) clamp(16px,3vw,28px) calc(28px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none;visibility:visible}
.sheet h2{font-size:30px;margin-right:48px}
.sheet .mx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.sheet .panel{margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:90;opacity:0;transition:.3s;pointer-events:none;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mut);font-size:13px}
.r{text-align:right}
tr.tot td{font-weight:700}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td{background:var(--surf2)}
.tw{overflow-x:auto}
.tw table{min-width:640px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--sand);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.mail{background:#F6F4EF;border-radius:18px;overflow:hidden;color:#0E1424;font-size:15px;max-width:600px;margin:0 auto}
.mail-h{background:#0E1424;padding:22px 26px;height:76px}
.mail-h .logo{height:32px;color:#fff}.mail-h .logo{--amp:#8EA2FF}
.mail-b{padding:26px;background:#fff;margin:0 14px;border-radius:0 0 14px 14px}
.mail-b h3{font-size:26px;margin-bottom:10px}
.mail-b p{color:#3E4659;margin-bottom:14px}
.mail-b table{font-size:14px;margin-bottom:12px}
.mail-b td{padding:8px 0;border-color:#E3DED3}
.mail-b .btn{margin-top:6px}
.mail-f{padding:18px 26px 22px;font-size:12px;color:#596172;text-align:center}
/* panel admin */
body.is-admin #store,body.is-admin .demo-sw{display:none}
#admin{display:none}
body.is-admin #admin{display:block}
.adm{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:#0E1424;color:#C9D0DD;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{color:#fff;height:26px;margin:0 10px 22px;display:flex;align-items:center;gap:10px;text-decoration:none}
.side .brand .logo{--amp:#8EA2FF}
.side .brand span{font:600 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:#9AA4B8;border:1px solid #39425A;border-radius:99px;padding:3px 8px}
.side h3{font:600 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#7D879C;margin:16px 12px 6px}
.side a.it{display:flex;align-items:center;gap:12px;color:#C9D0DD;text-decoration:none;padding:9px 12px;border-radius:12px;font-weight:500;font-size:15px}
.side a.it:hover{color:#fff;background:rgba(255,255,255,.06)}
.side a.it[aria-current=page]{background:rgba(128,149,255,.18);color:#fff}
.side a.it .cnt{position:static;margin-left:auto;background:#8EA2FF;color:#0E1424}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 10px 0;border-top:1px solid #252E42;font-size:14px}
.side .me b{color:#fff;display:block}
.av{width:36px;height:36px;border-radius:50%;background:#2347F5;color:#fff;display:grid;place-items:center;font:700 13px var(--fb);flex:none}
.amain{min-width:0;padding:0 clamp(16px,3vw,36px) 56px}
.atop{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px;margin-bottom:10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.atop h1{font-size:clamp(24px,3vw,34px)}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.burger{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.kpi,.panel{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel.np{padding:6px 8px}
.kpi > span{color:var(--mut);font-size:14px}
.kpi strong{display:block;font:800 32px var(--fd);margin:6px 0 4px;letter-spacing:-.02em}
.up{color:var(--ok);font-size:13px;font-weight:600}.dn{color:var(--bad);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.two.eq{grid-template-columns:1fr 1fr}
.two>*,.co-g>*,.pdp>*,.edit>*,.news-in>*,.adm>*,.ft-g>*{min-width:0}
.panel h3{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 small{font:500 13px var(--fb);color:var(--mut)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.tools label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.srch{position:relative;flex:1 1 260px;max-width:420px}
.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch .in{padding-left:38px}
.bars{display:flex;align-items:flex-end;gap:4px;height:220px;padding:22px 0 0;border-bottom:1px solid var(--line);position:relative}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.bars i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bars .b:hover i{background:var(--acc-h)}
.bars .b:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:8px;white-space:nowrap;z-index:2}
.bars .b:hover::after{bottom:auto;top:-6px}
.xl{display:flex;gap:4px;font-size:11px;color:var(--mut);margin-top:6px}
.xl span{flex:1;text-align:center;min-width:0;white-space:nowrap}
.ymax{position:absolute;top:0;left:0;font-size:12px;color:var(--mut)}
.hb-row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.hb-row .t{height:10px;background:var(--sand);border-radius:99px;overflow:hidden}
.hb-row .t i{display:block;height:100%;background:var(--acc);border-radius:99px}
.list .r2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .r2:last-child{border:0}
.list a.r2{text-decoration:none}
.list a.r2:hover b{text-decoration:underline}
.thumb{display:flex;align-items:center;gap:12px}
.thumb .media{width:44px;height:52px;border-radius:10px;flex:none}
.sw{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-pressed=true]{background:var(--acc)}
.sw[aria-pressed=true]::after{left:21px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.form .fld.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:15px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.hist{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:12px}
.hist li{position:relative;font-size:14px}
.hist li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.hist small{color:var(--mut);display:block}
.oitems .r2{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.oitems .media{width:52px;aspect-ratio:4/5;border-radius:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.libpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.libpick label{position:relative;cursor:pointer;border-radius:14px;overflow:hidden;border:2px solid transparent}
.libpick label:has(input:checked){border-color:var(--acc)}
.libpick input{position:absolute;opacity:0}
.libpick .media{aspect-ratio:3/4}
.libpick span{position:absolute;z-index:2;left:6px;bottom:6px;right:6px;background:var(--surf);border-radius:8px;font-size:12px;padding:3px 6px}
.libpick label:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0E1424}
.login .box{width:min(440px,100%);margin:0}
.login .brand{height:34px;color:var(--ink);margin-bottom:22px;display:block}
/* marca */
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lv{border-radius:20px;height:170px;display:grid;place-items:center;padding:30px;border:1px solid var(--line)}
.lv .logo{height:44px}
.lv.l1{background:#F6F4EF;color:#0E1424}.lv.l1{--amp:#2347F5}
.lv.l2{background:#0E1424;color:#fff}.lv.l2{--amp:#8EA2FF}
.lv.l3{background:#2347F5;color:#fff}.lv.l3{--amp:#fff}
.lv.l4{background:#E9E3D7}
.sym{width:84px;height:84px;border-radius:22px;background:#2347F5;display:grid;place-items:center}
.sym svg{width:60%;height:60%}
.cap{font-size:14px;color:var(--mut);margin-top:8px}
.swatch{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surf)}
.swatch i{display:block;height:96px}
.swatch div{padding:12px 14px;font-size:14px}
.swatch b{display:block;font-size:15px}
.typo{display:grid;gap:12px}
.typo .t1{font:800 clamp(40px,6vw,72px)/.95 var(--fd);letter-spacing:-.04em}
.typo .t2{font:400 18px/1.55 var(--fb);max-width:60ch}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.app{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;align-content:start}
.app h4{margin:0;font:600 15px var(--fb)}
.label{background:#fff;color:#0E1424;border:2px solid #0E1424;border-radius:12px;padding:14px;font-size:12px;display:grid;gap:8px}
.label .top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0E1424;padding-bottom:8px;height:36px}
.label .logo{height:20px}.label .logo{--amp:#2347F5}
.label .bc{height:34px;background:repeating-linear-gradient(90deg,#0E1424 0 2px,transparent 2px 4px,#0E1424 4px 5px,transparent 5px 8px,#0E1424 8px 11px,transparent 11px 12px)}
.tag{width:150px;height:230px;margin:0 auto;background:#2347F5;border-radius:16px 16px 18px 18px;position:relative;color:#fff;display:grid;align-content:center;justify-items:center;gap:10px;font-size:12px;text-align:center}
.tag::before{content:"";position:absolute;top:14px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surf)}
.tag .logo{height:30px;color:#fff}.tag .logo{--amp:#fff}
.post{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;color:#fff}
.post .media{position:absolute;inset:0;--mbg:#2347F5}
.post .media .fb{color:#E9E3D7}
.post::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(14,20,36,.8));z-index:1}
.post div{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;font:800 26px/.95 var(--fd);letter-spacing:-.03em}
.post .logo{height:18px;color:#fff;position:absolute;top:14px;left:16px;z-index:2}.post .logo{--amp:#fff}
.bag{width:170px;height:200px;margin:24px auto 0;background:#0E1424;border-radius:6px 6px 14px 14px;position:relative;display:grid;place-items:center}
.bag::before{content:"";position:absolute;top:-26px;left:50%;width:70px;height:46px;margin-left:-35px;border:6px solid #0E1424;border-bottom:0;border-radius:40px 40px 0 0}
.bag svg{width:56%}
.voice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.voice div{border-radius:16px;padding:14px 16px;font-size:15px}
.voice .y{background:var(--ok-soft)}.voice .n{background:var(--bad-soft)}
.voice b{display:block;margin-bottom:6px}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000;font:13px/1.5 var(--fb)}
 #print .logo{height:30px;color:#0E1424}#print .logo{--amp:#2347F5}
 @page{margin:16mm}
}
.cp{max-width:760px;margin:0 auto;background:#fff;color:#0E1424;padding:28px;border-radius:12px}
.cp-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #0E1424;padding-bottom:16px;height:auto}

let lastFocus=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)}
function veil(){const any=["#cart.open","#search.open","#sheet.open","#mnav.open",".side.open"].some(s=>$(s))||$("#modal").innerHTML;$("#veil").classList.toggle("open",!!any)}
function modal(html,o={}){lastFocus=lastFocus||document.activeElement;$("#modal").innerHTML=`<div class="mbox ${o.wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(o.label||"Ventana")}" tabindex="-1"><button class="iconbtn mx" data-act="closeModal" aria-label="Cerrar">${ic("x")}</button>${html}</div>`;veil();setTimeout(()=>{const f=$("#modal [autofocus]")||$("#modal .mbox");f.focus()},30)}
function closeModal(){if(!$("#modal").innerHTML)return;$("#modal").innerHTML="";veil();if(lastFocus&&!$("#sheet.open")){lastFocus.focus&&lastFocus.focus();lastFocus=null}}
function ask(title,msg,ok="Confirmar",danger){return new Promise(res=>{modal(`<h2>${esc(title)}</h2><p class="mut">${msg}</p><div class="mact"><button class="btn ghost" data-act="askNo">Volver</button><button class="btn ${danger?"danger":"acc"}" data-act="askYes" autofocus>${esc(ok)}</button></div>`,{label:title});ask.res=res})}
function sheet(html,label){if(!$("#sheet.open"))lastFocus=document.activeElement;const s=$("#sheet");s.innerHTML=`<div role="dialog" aria-modal="true" aria-label="${esc(label)}"><button class="iconbtn mx" data-act="closeSheet" aria-label="Cerrar">${ic("x")}</button>${html}</div>`;s.classList.add("open");s.setAttribute("aria-hidden","false");veil();s.scrollTop=0;setTimeout(()=>{const h=$("#sheet h2");h.tabIndex=-1;h.focus()},60)}
function closeSheet(){const s=$("#sheet");if(!s.classList.contains("open"))return;s.classList.remove("open");s.setAttribute("aria-hidden","true");veil();if(lastFocus){lastFocus.focus&&lastFocus.focus();lastFocus=null}}
function openCart(o){const c=$("#cart");if(o){lastFocus=document.activeElement;drawCart()}c.classList.toggle("open",!!o);c.setAttribute("aria-hidden",!o);veil();if(o)setTimeout(()=>$("#cart .mx").focus(),60);else if(lastFocus){lastFocus.focus&&lastFocus.focus();lastFocus=null}}
